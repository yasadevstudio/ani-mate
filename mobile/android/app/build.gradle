apply plugin: 'com.android.application'

// Single source of truth for the app version: the project's package.json. Parsed here so
// there is exactly one number to change at release time.
def animatePkg = new groovy.json.JsonSlurper().parseText(
        file("../../../package.json").text)
def animateVer = animatePkg.version as String
def animateParts = animateVer.tokenize('.')
project.ext.animateVersionName = animateVer
// ⛔ versionCode IS DATE-BASED, NOT DERIVED FROM THE VERSION STRING, AND THAT IS DELIBERATE.
// The release workflow has always set it with `date +%Y%m%d`, so builds already in the wild
// carry codes like 20260825. A semver-derived code (0.5.0 -> 500) would be LOWER than what
// users already have installed, and Android refuses a lower versionCode as a downgrade —
// every existing install would stop being able to update. Keep the scheme that shipped.
project.ext.animateVersionCode = (new Date().format('yyyyMMdd')) as int

android {
    namespace = "com.yasa.animate"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yasa.animate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ⛔ THESE USED TO BE HARDCODED AT 1 / "1.0" AND NEVER MOVED.
        // The release checklist in CLAUDE.md lists six places to bump and this is not one of
        // them, so the Android app reported 1.0 while package.json said 0.4.7, and every APK
        // built was named ANI-MATE-1.0-mobile.apk. Read the real version instead, so the
        // Android build cannot drift from the project again.
        //
        // versionCode must INCREASE for Android to accept an update, so it is derived:
        //   major*10000 + minor*100 + patch   (0.5.0 -> 500)
        versionCode project.ext.animateVersionCode
        versionName project.ext.animateVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else {
                def debugKs = file("${System.getProperty('user.home')}/.android/debug.keystore")
                storeFile debugKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            def vName = variant.versionName
            outputFileName = "ANI-MATE-${vName}-mobile.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
