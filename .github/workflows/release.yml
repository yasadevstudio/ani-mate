name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set version from tag
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.yml
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set version from tag
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build Linux packages
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          retention-days: 1

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # ⛔ MUST BE SET EXPLICITLY. The v3 default package list still asks for `tools`,
          # which Google has REMOVED from the SDK, so sdkmanager exits 1 with
          # "Failed to find package 'tools'" and the Android job dies before it builds
          # anything. Broke the v0.5.0 run on 2026-10-05; the last green Android build was
          # 2026-08-25, before the removal. Nothing in this repo changed to cause it.
          packages: 'platform-tools'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set version in build files
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # build.gradle NO LONGER NEEDS PATCHING. It reads the version from package.json
          # and computes a date-based versionCode itself, so the two seds that used to live
          # here are gone. They matched the literals `versionCode 1` and `versionName "1.0"`,
          # which no longer exist — leaving them would have been a silent no-op that looked
          # like it was still doing its job.
          # JS app version constant still needs setting from the tag.
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VERSION}'/" mobile/www/js/ani-mate-ui.js
          grep -q "versionName project.ext.animateVersionName" mobile/android/app/build.gradle \
            || { echo "build.gradle no longer reads the version from package.json"; exit 1; }

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/ani-mate-release.keystore

      - name: Build release APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=/tmp/ani-mate-release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=ani-mate \
            -PRELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 1

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-win

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist-linux

      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: dist-android

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ANI-MATE v${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist-win/ANI-MATE-Setup-${{ steps.version.outputs.VERSION }}.exe
            dist-win/ANI-MATE-Setup-${{ steps.version.outputs.VERSION }}.exe.blockmap
            dist-win/latest.yml
            dist-linux/ANI-MATE-${{ steps.version.outputs.VERSION }}.AppImage
            dist-linux/ani-mate_${{ steps.version.outputs.VERSION }}_amd64.deb
            dist-linux/latest-linux.yml
            dist-android/ANI-MATE-${{ steps.version.outputs.VERSION }}-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
